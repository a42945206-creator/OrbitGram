name: Build OrbitGram APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        
    - name: Generate Android Project
      run: flutter create . --platforms=android --project-name=orbitgram

    # --- ПРИНУДИТЕЛЬНО ПЕРЕЗАПИСЫВАЕМ ФАЙЛ ПРАВИЛЬНЫМИ НАСТРОЙКАМИ ---
    - name: Overwrite build.gradle.kts
      run: |
        cat > android/app/build.gradle.kts << 'EOF'
        plugins {
            id("com.android.application")
            id("kotlin-android")
            id("dev.flutter.flutter-gradle-plugin")
            id("com.google.gms.google-services")
        }

        android {
            namespace = "com.example.orbitgram"
            compileSdk = flutter.compileSdkVersion
            ndkVersion = flutter.ndkVersion

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = JavaVersion.VERSION_17.toString()
            }

            defaultConfig {
                applicationId = "com.example.orbitgram"
                minSdk = 23
                targetSdk = flutter.targetSdkVersion
                versionCode = flutter.versionCode
                versionName = flutter.versionName
            }

            buildTypes {
                release {
                    signingConfig = signingConfigs.getByName("debug")
                }
            }
        }

        flutter {
            source = "../.."
        }
        EOF

    - name: Create google-services.json
      run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

    - name: Generate Launcher Icons
      run: dart run flutter_launcher_icons
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OrbitGram-APK
        path: build/app/outputs/flutter-apk/app-release.apk
