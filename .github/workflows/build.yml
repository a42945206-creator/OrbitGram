name: Build OrbitGram APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        
    - name: Generate Android Project
      run: flutter create . --platforms=android --project-name=orbitgram

    # --- ВОТ ЭТОТ ШАГ ВОЗВРАЩАЕТ НАШ ФАЙЛ С minSdk = 23 ---
    - name: Copy custom build.gradle.kts
      run: cp android/app/build.gradle.kts android/app/build.gradle.kts.bak || true

    - name: Create google-services.json
      run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

    - name: Generate Launcher Icons
      run: dart run flutter_launcher_icons
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OrbitGram-APK
        path: build/app/outputs/flutter-apk/app-release.apk
