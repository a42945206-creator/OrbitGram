name: Build OrbitGram APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        
    - name: Generate Android Project
      run: flutter create . --platforms=android --project-name=orbitgram

    # --- Находим файл build.gradle(.kts) и меняем minSdk на 23 ---
    - name: Bump minSdkVersion to 23
      run: |
        find android/app -maxdepth 1 -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' {} \;
        find android/app -maxdepth 1 -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' {} \;

    # --- Создаем файл конфигурации Firebase из секрета ---
    - name: Create google-services.json
      run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OrbitGram-APK
        path: build/app/outputs/flutter-apk/app-release.apk
